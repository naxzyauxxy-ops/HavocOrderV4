# =====================================================
#              HavocOrders - menus.yml
# =====================================================
# Chest menus. Every layout is here: SIZE, which slots hold content, and a fixed slot
# for each named control, so paging never moves the buttons around.
#
# SLOTS are 0-based, left to right, top to bottom. A 54-slot menu is 6 rows of 9.
# CONTENT-SLOTS defaults to an inset rectangle, leaving a one-slot border.
# Anything left empty is filled with the FILLER item below.
# Dialogs replace chest GUIs, so there are no MATERIAL or SLOT keys any more.
# Each screen has a TITLE, some BODY lines, and BUTTONS with a LABEL and TOOLTIP.
# TOOLTIP is a list; the lines are joined with newlines in the hover text.
# Hex colours (&#f40d0d) and legacy codes (&7) both work.

# Display names for the sort and filter cycles.
NAMES:
  SORT:
    MOST-PAID: "Most Paid"
    MOST-DELIVERED: "Most Delivered"
    RECENTLY-LISTED: "Recently Listed"
    MOST-MONEY-PER-ITEM: "Most Money Per Item"
  FILTER:
    ALL: "All"
    BLOCKS: "Blocks"
    TOOLS: "Tools"
    FOOD: "Food"
    COMBAT: "Combat"
    POTIONS: "Potions"
    BOOKS: "Books"
    INGREDIENTS: "Ingredients"
    UTILITIES: "Utilities"


# The border item that fills every empty slot.
FILLER:
  MATERIAL: "GRAY_STAINED_GLASS_PANE"
  NAME: " "

MENUS:

  # ======================| ORDER BOARD |======================

  ORDERS:
    TITLE: "&8ᴏʀᴅᴇʀѕ"
    SIZE: 54
    INFO-SLOT: 4
    INFO-MATERIAL: "PAPER"
    # 21 slots, matching SETTINGS.ORDERS-PER-PAGE
    CONTENT-SLOTS: [ 10,11,12,13,14,15,16, 19,20,21,22,23,24,25, 28,29,30,31,32,33,34 ]
    SLOTS:
      PREVIOUS: 45
      SORT: 47
      FILTER: 48
      SEARCH: 49
      MY-ORDERS: 50
      CLOSE: 52
      NEXT: 53
    BODY:
      - "&7{results} orders"
      - "&8Page {page} of {pages}"
      - ""
      - "&7Sort: &f{sort}"
      - "&7Filter: &f{filter}"
      - "&7Search: &f{query}"
    EMPTY: "&7Nothing matches those filters."
    BUTTONS:
      ORDER:
        LABEL: "&#f40d0d{amount_left}x {material}"
        TOOLTIP:
          - "&8{player}'s order"
          - ""
          - "&7Pays &a${unit_price} &7each"
          - "&7Progress: &f{current}&8/&f{max}"
          - "&7Paid out: &a${paid}"
          - "&7You are carrying: &f{held}"
          - ""
          - "&fClick to deliver"
          - "&8Expires in {expires}"
      OWN-ORDER:
        LABEL: "&e{amount_left}x {material}"
        TOOLTIP:
          - "&8Your order"
          - ""
          - "&7Progress: &f{current}&8/&f{max}"
          - "&7Paid out: &a${paid}"
          - "&7Waiting to collect: &f{collectable}"
          - ""
          - "&fClick to manage"
          - "&8Expires in {expires}"
      PREVIOUS:
        MATERIAL: "ARROW"
        LABEL: "&#f40d0dPrevious Page"
        TOOLTIP: [ "&7Page {previous} of {pages}" ]
      NEXT:
        MATERIAL: "ARROW"
        LABEL: "&#f40d0dNext Page"
        TOOLTIP: [ "&7Page {next} of {pages}" ]
      SORT:
        MATERIAL: "COMPARATOR"
        LABEL: "&#f40d0dSort"
        TOOLTIP:
          - "&7Currently: &f{sort}"
          - ""
          - "&fClick to cycle"
      FILTER:
        MATERIAL: "HOPPER"
        LABEL: "&#f40d0dFilter"
        TOOLTIP:
          - "&7Currently: &f{filter}"
          - ""
          - "&fClick to cycle"
      SEARCH:
        MATERIAL: "OAK_SIGN"
        LABEL: "&#f40d0dSearch"
        TOOLTIP:
          - "&7Currently: &f{query}"
          - ""
          - "&fClick to search"
          - "&8Or use /orders <text>"
      MY-ORDERS:
        MATERIAL: "CHEST"
        LABEL: "&#f40d0dYour Orders"
        TOOLTIP: [ "&7Manage your orders and loot" ]
      CLOSE:
        MATERIAL: "BARRIER"
        LABEL: "&cClose"
        TOOLTIP: [ ]

